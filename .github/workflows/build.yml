name: Build

# Full 4-platform build on version tags and on demand. Deliberately NOT on every
# push: macOS runners bill at 10x minutes on a private repo (Linux 1x, Windows
# 2x), so keep the expensive matrix off the commit path and use ci.yml as the
# fast analyze/test gate instead.
#
# Every job is gated on `github.server_url == 'https://github.com'` so a mirror
# to Gitea Actions skips (rather than fails) these GitHub-only jobs.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to attach build artifacts to a release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      # The runner image ships the Android SDK; this just pre-accepts licences.
      - run: yes | flutter doctor --android-licenses || true

      # Decode the release keystore from a secret into the runner temp dir. If
      # the secret is absent we build debug-signed instead and say so, so a
      # missing secret can never break an otherwise-good release build.
      - name: Prepare release keystore
        id: keystore
        env:
          KS_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_BASE64" ]; then
            printf '%s' "$KS_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret; APK will be debug-signed."
          fi

      - name: Build release APK
        run: flutter build apk --release
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Report APK signer
        if: steps.keystore.outputs.configured == 'true'
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found in $SDK/build-tools"; exit 1; }
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: concordance-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    name: Linux bundle
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # flutter build linux unconditionally uses clang/clang++ and links GTK.
      - run: >
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build linux --release

      - run: tar -czf concordance-linux-x64.tar.gz -C build/linux/x64/release bundle

      - uses: actions/upload-artifact@v4
        with:
          name: concordance-linux
          path: concordance-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows bundle
    if: github.server_url == 'https://github.com'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release

      - run: >
          Compress-Archive
          -Path build/windows/x64/runner/Release
          -DestinationPath concordance-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: concordance-windows
          path: concordance-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS app
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build macos --release

      # ditto preserves the .app's symlinks + permissions (zip does not).
      - run: >
          ditto -c -k --keepParent
          "build/macos/Build/Products/Release/Concordance.app"
          concordance-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: concordance-macos
          path: concordance-macos.zip
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Flatten the artifacts into one directory and publish a SHA-256 for each
      # so users can verify a download matches what we built.
      - name: Generate SHA-256 checksums
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp -t dist {} +
          cd dist
          sha256sum -- * > SHA256SUMS
          echo "Checksums:"
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
