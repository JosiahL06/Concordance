name: Docs

# Builds the Material for MkDocs site in docs/ and deploys it to GitHub Pages.
#
# GitHub-only: the Pages actions (configure/upload/deploy-pages) do not exist
# on the Gitea mirror, so the whole workflow skips there instead of failing —
# the same gate ci.yml and build.yml use.
#
# One-time setup (repo owner): Settings → Pages → Source: "GitHub Actions".
# Live URL: https://josiahl06.github.io/Concordance/
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

# GITHUB_TOKEN scopes required to publish to Pages (id-token is for OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # setup-python only auto-detects requirements.txt; this file has a
          # docs-specific name, so the cache key must point at it explicitly.
          cache-dependency-path: requirements-docs.txt

      # --strict turns broken internal links and missing nav entries into
      # build failures, so the published site can never contain dead links.
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
